---
# Unit tests of the SLO recording rules and burn rate alerts
# (charts/observability-extras/templates/prometheusrule-slo.yaml).
# Run by `make lint` (scripts/check-rules.sh), which renders the chart into
# rules.yaml next to this file. Firing alerts are checked through the ALERTS
# series, so the tests do not depend on the annotation texts.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # 10 requests/s, 5 % of them 5xx: 50x the allowed 0.1 %. Both the fast
  # (14.4x over 1 h and 5 min) and the slow burn alerts fire.
  - name: availability, 5 % errors -> fast and slow burn
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="5"}'
        values: '0+30x120'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="2"}'
        values: '0+570x120'
    promql_expr_test:
      # Rounded: the ratio of two rates is not exact in floating point.
      - expr: round(slo:sli_error:ratio_rate5m{slo="app-availability"}, 0.0001)
        eval_time: 15m
        exp_samples:
          - labels: '{slo="app-availability"}'
            value: 0.05
      - expr: ALERTS{alertstate="firing", slo="app-availability"}
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="AppAvailabilityBudgetBurnFast", alertstate="firing", severity="critical", slo="app-availability"}'
            value: 1
          - labels: 'ALERTS{alertname="AppAvailabilityBudgetBurnSlow", alertstate="firing", severity="warning", slo="app-availability"}'
            value: 1

  # 0.5 % errors: 5x the allowed rate. Below both fast thresholds (14.4x
  # and 6x), above the slow ones (3x over 1 day and 2 h).
  - name: availability, 0.5 % errors -> slow burn only
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+1000x240'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="5"}'
        values: '0+5x240'
    promql_expr_test:
      - expr: ALERTS{alertstate="firing", slo="app-availability"}
        eval_time: 3h
        exp_samples:
          - labels: 'ALERTS{alertname="AppAvailabilityBudgetBurnSlow", alertstate="firing", severity="warning", slo="app-availability"}'
            value: 1

  # No 5xx on the application route: the ratio is recorded as 0 and no
  # alert fires, even though the mirror cluster (shadow copies, answers
  # discarded) and another route fail all the time.
  - name: availability, healthy route -> no alert, mirror and other routes ignored
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2-mirror-2"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2-mirror-2", envoy_response_code_class="5"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/ui-grafana/rule/0", envoy_response_code_class="5"}'
        values: '0+600x120'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate1h{slo="app-availability"}
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate1h{slo="app-availability"}'
            value: 0
      - expr: ALERTS{slo="app-availability"}
        eval_time: 90m
        exp_samples: []

  # No traffic at all: nothing to measure, no ratio, no alert.
  - name: availability, no traffic -> no ratio, no alert
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0x60'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate1h{slo="app-availability"}
        eval_time: 60m
        exp_samples: []
      - expr: ALERTS{slo="app-availability"}
        eval_time: 60m
        exp_samples: []

  # 20 % of the requests slower than 250 ms: 20x the allowed 1 %, above the
  # fast threshold (14.4x).
  - name: latency, 20 % slow requests -> fast burn
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/gateway/app/rule/2", le="250.0"}'
        values: '0+480x120'
      - series: 'envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/gateway/app/rule/2", le="+Inf"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_time_count{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x120'
    promql_expr_test:
      # Rounded: the ratio of two rates is not exact in floating point.
      - expr: round(slo:sli_error:ratio_rate5m{slo="app-latency"}, 0.0001)
        eval_time: 15m
        exp_samples:
          - labels: '{slo="app-latency"}'
            value: 0.2
      - expr: ALERTS{alertstate="firing", alertname="AppLatencyBudgetBurnFast"}
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="AppLatencyBudgetBurnFast", alertstate="firing", severity="critical", slo="app-latency"}'
            value: 1

  # All requests fast: no latency alert.
  - name: latency, all requests fast -> no alert
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/gateway/app/rule/2", le="250.0"}'
        values: '0+600x120'
      - series: 'envoy_cluster_upstream_rq_time_count{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x120'
    promql_expr_test:
      - expr: ALERTS{slo="app-latency"}
        eval_time: 90m
        exp_samples: []

  # 5 % errors for an hour, then 35 minutes without errors: the long windows
  # are still high, but both short windows (5 min, 30 min) have recovered,
  # so the fast burn alert must stop (the slow one may still be on).
  - name: availability, short windows recovered -> no fast burn
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x95'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="5"}'
        values: '0+30x60 1800+0x35'
    promql_expr_test:
      - expr: ALERTS{alertname="AppAvailabilityBudgetBurnFast"}
        eval_time: 95m
        exp_samples: []

  # 0.7 % errors: 7x the allowed rate. Below the 1 h / 5 min threshold
  # (14.4x), above the 6 h / 30 min one (6x): fast burn through that pair.
  - name: availability, 0.7 % errors -> fast burn via 6 h / 30 min
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+1000x150'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="5"}'
        values: '0+7x150'
    promql_expr_test:
      - expr: ALERTS{alertname="AppAvailabilityBudgetBurnFast", alertstate="firing"}
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="AppAvailabilityBudgetBurnFast", alertstate="firing", severity="critical", slo="app-availability"}'
            value: 1

  # Every request fails, but there are only 0.005 requests per second (18
  # per hour), below the minimum of 0.01/s: no alert.
  - name: availability, too little traffic -> no alert
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+0.3x120'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", envoy_response_code_class="5"}'
        values: '0+0.3x120'
    promql_expr_test:
      - expr: ALERTS{slo="app-availability"}
        eval_time: 90m
        exp_samples: []

  # No requests: no latency ratio (rather than NaN) and no alert.
  - name: latency, no traffic -> no ratio, no alert
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/gateway/app/rule/2", le="250.0"}'
        values: '0x60'
      - series: 'envoy_cluster_upstream_rq_time_count{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0x60'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{slo="app-latency"}
        eval_time: 60m
        exp_samples: []
      - expr: ALERTS{slo="app-latency"}
        eval_time: 60m
        exp_samples: []

  # Bucket boundary written as "250" (Prometheus 2 style) works the same.
  - name: latency, integer bucket boundary -> same ratio
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/gateway/app/rule/2", le="250"}'
        values: '0+480x30'
      - series: 'envoy_cluster_upstream_rq_time_count{envoy_cluster_name="httproute/gateway/app/rule/2"}'
        values: '0+600x30'
    promql_expr_test:
      - expr: round(slo:sli_error:ratio_rate5m{slo="app-latency"}, 0.0001)
        eval_time: 15m
        exp_samples:
          - labels: '{slo="app-latency"}'
            value: 0.2

  # Envoy creates its traffic counters lazily: after a restart the request
  # and 5xx series of the route appear with the first batch, already at 10.
  # rate() over the raw series would need a second sample and show nothing;
  # the zero-filled copies start at 0 with the cluster
  # (envoy_cluster_membership_total), so the first batch counts.
  - name: first batch of 5xx in fresh series -> counted
    interval: 1m
    input_series:
      - series: 'envoy_cluster_membership_total{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a"}'
        values: '1x30'
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a"}'
        values: '_x10 10x20'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a", envoy_response_code_class="5"}'
        values: '_x10 10x20'
    promql_expr_test:
      - expr: envoy_app:upstream_rq_5xx_total:filled
        eval_time: 5m
        exp_samples:
          - labels: 'envoy_app:upstream_rq_5xx_total:filled{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a"}'
            value: 0
      - expr: round(slo:sli_error:ratio_rate5m{slo="app-availability"}, 0.0001)
        eval_time: 13m
        exp_samples:
          - labels: '{slo="app-availability"}'
            value: 1

  # Earlier traffic (60 requests a minute), then the first 5xx: only the 5xx
  # series is new. 10 failed out of the 300 requests of the last 5 minutes.
  - name: first 5xx after healthy traffic -> counted
    interval: 1m
    input_series:
      - series: 'envoy_cluster_membership_total{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a"}'
        values: '1x30'
      - series: 'envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a"}'
        values: '0+60x30'
      - series: 'envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/gateway/app/rule/2", pod="a", envoy_response_code_class="5"}'
        values: '_x10 10x20'
    promql_expr_test:
      # About 0.033, but not exactly: the SLO groups and the envoy-app-counters
      # group run on their own tickers, so an SLO rule may see the recorded
      # counters up to one evaluation interval late (the burst then falls
      # into a slightly different window). Hence a range, not a value.
      - expr: count(slo:sli_error:ratio_rate5m{slo="app-availability"} > 0.02 < 0.06)
        eval_time: 13m
        exp_samples:
          - labels: '{}'
            value: 1
