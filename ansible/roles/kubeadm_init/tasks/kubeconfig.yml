---
- name: Look up home directory of {{ kubeadm_init_kubeconfig_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ kubeadm_init_kubeconfig_user }}"

- name: Create .kube directory for {{ kubeadm_init_kubeconfig_user }}
  ansible.builtin.file:
    path: "{{ ansible_facts['getent_passwd'][kubeadm_init_kubeconfig_user][4] }}/.kube"
    state: directory
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    group: "{{ ansible_facts['getent_passwd'][kubeadm_init_kubeconfig_user][2] }}"
    mode: "0700"

- name: Install kubeconfig for {{ kubeadm_init_kubeconfig_user }}
  ansible.builtin.copy:
    src: "{{ kubeadm_init_admin_kubeconfig }}"
    dest: "{{ ansible_facts['getent_passwd'][kubeadm_init_kubeconfig_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    group: "{{ ansible_facts['getent_passwd'][kubeadm_init_kubeconfig_user][2] }}"
    mode: "0600"
