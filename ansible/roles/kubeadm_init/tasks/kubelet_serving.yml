---
# The kubelet serves its API (logs, exec, metrics) over HTTPS. By default it
# signs that certificate itself, so nobody can verify it; metrics-server
# would need --kubelet-insecure-tls. With serverTLSBootstrap the kubelet
# requests the certificate from the cluster CA instead (signer
# kubernetes.io/kubelet-serving). Kubernetes never approves these requests
# on its own: a request only proves which node sent it, not that the names
# in it belong to that node. They are approved by
# files/approve-kubelet-serving-csr.sh, for every node of the inventory and
# only with the names and addresses Ansible knows for that node.
#
# New clusters get serverTLSBootstrap from the kubeadm configuration; for a
# cluster created before it existed, the kubelet configuration on the node
# and the cluster-wide copy kubeadm uses for upgrades and joining nodes
# (ConfigMap kube-system/kubelet-config) are updated in place. Restarting
# the kubelet does not stop running pods.
#
# The certificate is valid for one year; the kubelet requests a new one
# when 70-90 % of that has passed. Pending requests are approved by every
# `make deploy` and, in between, by an hourly systemd timer on the control
# plane (same script, same check).

- name: Enable serverTLSBootstrap in the kubelet configuration of this node
  ansible.builtin.lineinfile:
    path: "{{ kubeadm_init_kubelet_config }}"
    regexp: '^serverTLSBootstrap:'
    line: 'serverTLSBootstrap: true'
  notify: Restart kubelet

# The certificate request below needs the restarted kubelet.
- name: Apply a pending kubelet restart
  ansible.builtin.meta: flush_handlers

- name: Enable serverTLSBootstrap in the cluster-wide kubelet configuration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      config="$(kubectl --namespace kube-system get configmap kubelet-config --output json)"
      if jq -e '.data.kubelet | split("\n") | any(. == "serverTLSBootstrap: true")' <<<"${config}" >/dev/null; then
        echo unchanged
        exit 0
      fi
      jq '.data.kubelet |= ((split("\n") | map(select(startswith("serverTLSBootstrap:") | not)) | join("\n") | rtrimstr("\n"))
        + "\nserverTLSBootstrap: true\n")' <<<"${config}" | kubectl replace --filename - >/dev/null
      echo changed
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  register: kubeadm_init_kubelet_configmap
  changed_when: kubeadm_init_kubelet_configmap.stdout == 'changed'

- name: Create the directory for the approver configuration
  ansible.builtin.file:
    path: "{{ kubeadm_init_approver_nodes_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Names and addresses each node may have in its certificate (the kubelet
# puts its host name and node IP there), from the inventory facts of every
# host (the first play of site.yml gathers them): host name, address of the
# default route (IPv4 and IPv6), `node_ip` if set; for this node also the
# API server address it was created with.
- name: Collect the names and addresses of the inventory nodes
  ansible.builtin.set_fact:
    kubeadm_init_serving_nodes: >-
      {{ kubeadm_init_serving_nodes | default({}) | combine({
           (hostvars[item]['ansible_facts']['nodename'] | lower):
             ([hostvars[item]['ansible_facts']['nodename'] | lower,
               hostvars[item]['ansible_facts']['default_ipv4']['address'] | default(''),
               hostvars[item]['ansible_facts']['default_ipv6']['address'] | default(''),
               hostvars[item]['node_ip'] | default(''),
               kubeadm_init_node_ip if item == inventory_hostname else '']
              | reject('equalto', '') | unique | list) }) }}
  loop: "{{ groups['all'] }}"
  when: hostvars[item]['ansible_facts']['nodename'] is defined

- name: Write the node list for the certificate approver
  ansible.builtin.copy:
    content: "{{ kubeadm_init_serving_nodes | to_nice_json }}\n"
    dest: "{{ kubeadm_init_approver_nodes_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Install the certificate approver
  ansible.builtin.copy:
    src: approve-kubelet-serving-csr.sh
    dest: "{{ kubeadm_init_approver_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the certificate approver units
  ansible.builtin.template:
    src: "kubelet-cert-approver.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ kubeadm_init_approver_unit }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]

- name: Enable the hourly certificate approver
  ansible.builtin.systemd_service:
    name: "{{ kubeadm_init_approver_unit }}.timer"
    enabled: true
    state: started
    daemon_reload: true

- name: Look for the serving certificate of the kubelet
  ansible.builtin.stat:
    path: "{{ kubeadm_init_kubelet_serving_cert }}"
  register: kubeadm_init_serving_cert

# A run interrupted between the configuration change and the kubelet
# restart leaves a kubelet that never asks for a certificate (the
# configuration is already in place, so no restart is notified again).
# Without a certificate and without a request of this node, restart it.
- name: Look for a certificate request of this node
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl get csr --output json | jq --arg user "system:node:{{ kubeadm_init_node_name }}" '[.items[]
        | select(.spec.signerName == "kubernetes.io/kubelet-serving" and .spec.username == $user)
        | select((.status.conditions // []) | length == 0)] | length'
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  register: kubeadm_init_pending_csr
  changed_when: false
  when: not kubeadm_init_serving_cert.stat.exists

- name: Restart the kubelet so that it requests its serving certificate
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
  when:
    - not kubeadm_init_serving_cert.stat.exists
    - kubeadm_init_pending_csr.stdout | int == 0
  changed_when: true

# Repeated until the kubelet of this node has its certificate (the request
# appears a moment after the kubelet starts).
- name: Approve the kubelet serving certificate requests
  ansible.builtin.shell:
    cmd: >-
      {{ kubeadm_init_approver_script | quote }} {{ kubeadm_init_approver_nodes_file | quote }}
      && test -s {{ kubeadm_init_kubelet_serving_cert | quote }}
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  register: kubeadm_init_csr_approval
  until: kubeadm_init_csr_approval.rc == 0
  retries: "{{ kubeadm_init_serving_cert_retries }}"
  delay: 5
  changed_when: >-
    not kubeadm_init_serving_cert.stat.exists
    or kubeadm_init_csr_approval.stdout != 'approved 0'
