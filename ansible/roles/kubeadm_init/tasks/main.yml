---
- name: Detect the state of an existing control plane
  ansible.builtin.include_tasks: state.yml

- name: Choose the API server address
  ansible.builtin.include_tasks: address.yml

# The configuration only matters for `kubeadm init`; it is not rendered for
# an existing cluster, where changing it would not reconfigure anything.
- name: Initialise the control plane
  when: not kubeadm_init_cluster_ready
  block:
    - name: Render kubeadm configuration
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: "{{ kubeadm_init_config_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Run kubeadm init
      ansible.builtin.command:
        cmd: "kubeadm init --config {{ kubeadm_init_config_path }}"
      changed_when: true

  rescue:
    - name: Explain how to recover from a failed kubeadm init
      ansible.builtin.fail:
        msg: >-
          kubeadm init failed, see its output above. Fix the cause and deploy again. If it failed
          after the preflight checks, the partial state it left behind blocks a retry: run
          `make destroy FORCE=1` (kubeadm reset and cleanup) first.

- name: Wait for the API server
  ansible.builtin.command:
    cmd: kubectl get --raw /readyz
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  register: kubeadm_init_readyz
  until: kubeadm_init_readyz.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Install kubeconfig for root and the invoking user
  ansible.builtin.include_tasks: kubeconfig.yml
  loop: "{{ ['root', kube_user] | unique }}"
  loop_control:
    loop_var: kubeadm_init_kubeconfig_user

- name: Read node metadata
  ansible.builtin.command:
    cmd: "kubectl get node {{ kubeadm_init_node_name }} --output json"
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  register: kubeadm_init_node_json
  changed_when: false

- name: Evaluate node taints and labels
  ansible.builtin.set_fact:
    kubeadm_init_node_tainted: >-
      {{ (kubeadm_init_node_json.stdout | from_json).spec.taints | default([])
         | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane') | list | length > 0 }}
    kubeadm_init_node_lb_excluded: >-
      {{ 'node.kubernetes.io/exclude-from-external-load-balancers'
         in (kubeadm_init_node_json.stdout | from_json).metadata.labels }}

# Single node: workloads must be schedulable on the control plane.
- name: Remove the control-plane taint
  ansible.builtin.command:
    cmd: "kubectl taint node {{ kubeadm_init_node_name }} node-role.kubernetes.io/control-plane:NoSchedule-"
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  when: k8s_single_node and kubeadm_init_node_tainted | bool
  changed_when: true

# kubeadm labels control-plane nodes with exclude-from-external-load-balancers;
# Cilium node IPAM then ignores the node and LoadBalancer Services (the
# Gateway) stay <pending>. On a single-node cluster the label is removed.
- name: Remove the exclude-from-external-load-balancers label
  ansible.builtin.command:
    cmd: "kubectl label node {{ kubeadm_init_node_name }} node.kubernetes.io/exclude-from-external-load-balancers-"
  environment:
    KUBECONFIG: "{{ kubeadm_init_admin_kubeconfig }}"
  when: k8s_single_node and kubeadm_init_node_lb_excluded | bool
  changed_when: true
