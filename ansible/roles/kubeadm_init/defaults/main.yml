---
# Explicitly requested API server advertise address (inventory/host var
# `node_ip`, then the NODE_IP environment variable), empty if none. See
# tasks/address.yml for how the final address is chosen.
kubeadm_init_node_ip_requested: "{{ node_ip | default(node_ip_override, true) | default('', true) }}"
# Used for a new cluster when nothing is requested.
kubeadm_init_node_ip_default: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
kubeadm_init_node_name: "{{ ansible_facts['nodename'] | lower }}"
kubeadm_init_config_path: /etc/kubernetes/kubeadm-config.yaml
kubeadm_init_cri_socket: unix:///run/containerd/containerd.sock
kubeadm_init_cluster_name: kubernetes
# Preflight checks to ignore, e.g. ["NumCPU", "Mem"] on very small VMs.
kubeadm_init_ignore_preflight_errors: []
kubeadm_init_admin_kubeconfig: /etc/kubernetes/admin.conf
kubeadm_init_manifests_dir: /etc/kubernetes/manifests
kubeadm_init_etcd_dir: /var/lib/etcd
# How long an existing control plane may take to answer (e.g. after a reboot):
# retries x 5 seconds.
kubeadm_init_api_wait_retries: 36
# Kubelet configuration written by kubeadm and the serving certificate the
# kubelet gets from the cluster CA (serverTLSBootstrap).
kubeadm_init_kubelet_config: /var/lib/kubelet/config.yaml
kubeadm_init_kubelet_serving_cert: /var/lib/kubelet/pki/kubelet-server-current.pem
# How long to wait for the kubelet's serving certificate request:
# retries x 5 seconds.
kubeadm_init_serving_cert_retries: 36
