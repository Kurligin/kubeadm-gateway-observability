---
# Hosts that already run Docker (for example GitHub-hosted ubuntu-24.04
# runners) ship containerd from a distribution package: /usr/bin/containerd,
# /lib/systemd/system/containerd.service and a config.toml with the CRI
# plugin disabled. Nothing is removed. Instead this role takes over the
# `containerd.service` name: the unit in /etc/systemd/system overrides the
# packaged one, points to the pinned binary in /usr/local/bin and to the
# config rendered below (CRI enabled). Docker keeps working because it talks
# to the same socket, now served by the pinned containerd.
- name: Detect a containerd installed from a distribution package
  ansible.builtin.stat:
    path: /usr/bin/containerd
  register: containerd_packaged

- name: Report the packaged containerd takeover
  ansible.builtin.debug:
    msg: >-
      A packaged containerd was found at /usr/bin/containerd (usually from Docker).
      It is left installed but not used: containerd.service now runs
      /usr/local/bin/containerd {{ containerd_version }} with the CRI plugin enabled.
  when: containerd_packaged.stat.exists

- name: Create download cache directory
  ansible.builtin.file:
    path: "{{ download_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download containerd release
  ansible.builtin.get_url:
    url: "{{ containerd_release_url }}"
    dest: "{{ download_cache_dir }}/containerd-{{ containerd_version }}-linux-{{ cpu_arch }}.tar.gz"
    checksum: "sha256:{{ containerd_sha256 }}"
    timeout: 60
    owner: root
    group: root
    mode: "0644"
  # A short network hiccup (GitHub release CDN) is retried.
  register: containerd_download
  retries: 3
  delay: 5
  until: containerd_download is succeeded

- name: Create containerd release directory
  ansible.builtin.file:
    path: "{{ containerd_install_root }}/{{ containerd_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack containerd release
  ansible.builtin.unarchive:
    src: "{{ download_cache_dir }}/containerd-{{ containerd_version }}-linux-{{ cpu_arch }}.tar.gz"
    dest: "{{ containerd_install_root }}/{{ containerd_version }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ containerd_install_root }}/{{ containerd_version }}/bin/containerd"

- name: Link containerd binaries into /usr/local/bin
  ansible.builtin.file:
    src: "{{ containerd_install_root }}/{{ containerd_version }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ containerd_binaries }}"
  notify: Restart containerd

- name: Install runc
  ansible.builtin.get_url:
    url: "{{ containerd_runc_release_url }}"
    dest: "{{ containerd_runc_binary_path }}"
    checksum: "sha256:{{ runc_sha256 }}"
    timeout: 60
    owner: root
    group: root
    mode: "0755"
  register: containerd_runc_download
  retries: 3
  delay: 5
  until: containerd_runc_download is succeeded

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

# A config.toml left by a packaged containerd (Docker) is kept as a
# timestamped backup next to it before being replaced.
- name: Render containerd configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart containerd

# Registry mirrors (registry_mirrors, group_vars/all/main.yml): a hosts.toml
# for every registry that has mirrors. containerd reads these files on every
# pull, so a change needs no restart.
- name: Start the list of registry mirrors
  ansible.builtin.set_fact:
    containerd_registry_hosts: []

- name: Collect the registry mirrors
  ansible.builtin.set_fact:
    containerd_registry_hosts: >-
      {{ containerd_registry_hosts
         + [{'registry': item.key, 'server': item.value.server,
             'mirrors': (item.value.mirrors | default('', true)).split(',') | map('trim') | reject('equalto', '') | list}] }}
  loop: "{{ registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Check the registry mirror addresses
  ansible.builtin.assert:
    that:
      - item.1 is match('^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
    fail_msg: >-
      Registry mirror '{{ item.1 }}' of {{ item.0.registry }} is not a URL of the form https://host[:port] (a mirror
      serves the registry's namespace at its root). Set REGISTRY_MIRRORS_{{ item.0.registry | upper
      | regex_replace('[^A-Z0-9]', '_') }} to a comma-separated list of such URLs, or to an empty value for none.
    quiet: true
  loop: "{{ containerd_registry_hosts | subelements('mirrors') }}"
  loop_control:
    label: "{{ item.0.registry }}: {{ item.1 }}"

- name: Create the registry host directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [containerd_hosts_dir]
       + containerd_registry_hosts | selectattr('mirrors') | map(attribute='registry')
         | map('regex_replace', '^', containerd_hosts_dir ~ '/') | list }}

- name: Configure the registry mirrors
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ containerd_hosts_dir }}/{{ item.registry }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ containerd_registry_hosts | selectattr('mirrors') | list }}"
  loop_control:
    label: "{{ item.registry }}: {{ item.mirrors | join(', ') }}, then {{ item.server }}"

# Only files this role wrote (they carry its marker line) are removed.
# find matches `contains` against each line from its start.
- name: Find registry host files written by an earlier run
  ansible.builtin.find:
    paths: "{{ containerd_hosts_dir }}"
    patterns: hosts.toml
    recurse: true
    contains: "# kubeadm-gateway-observability registry mirrors"
  register: containerd_hosts_files

- name: Remove the host files of registries without mirrors
  ansible.builtin.file:
    path: "{{ containerd_hosts_dir }}/{{ item }}/hosts.toml"
    state: absent
  loop: >-
    {{ containerd_hosts_files.files | map(attribute='path') | map('dirname') | map('basename')
       | difference(containerd_registry_hosts | selectattr('mirrors') | map(attribute='registry')) }}

- name: Install containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

# Image pulls go through the proxy of the deployment, if there is one
# (the files exist only then; removing them restarts containerd too). The
# proxy URL, which may hold a password, is in an environment file readable
# by root only, not in the unit (`systemctl show` would print it to anyone).
- name: Create the containerd drop-in and settings directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ containerd_dropin_dir }}"
    - "{{ containerd_proxy_env_file | dirname }}"
  when: proxy_enabled | bool

- name: Write the proxy settings of containerd
  ansible.builtin.template:
    src: proxy.env.j2
    dest: "{{ containerd_proxy_env_file }}"
    owner: root
    group: root
    mode: "0600"
  when: proxy_enabled | bool
  notify: Restart containerd

- name: Configure the proxy for containerd
  ansible.builtin.template:
    src: http-proxy.conf.j2
    dest: "{{ containerd_dropin_dir }}/http-proxy.conf"
    owner: root
    group: root
    mode: "0644"
  when: proxy_enabled | bool
  notify: Restart containerd

- name: Remove the containerd proxy configuration when no proxy is set
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ containerd_dropin_dir }}/http-proxy.conf"
    - "{{ containerd_proxy_env_file }}"
  when: not proxy_enabled | bool
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true

# kubeadm must talk to the final configuration, so pending restarts are
# executed now rather than at the end of the play.
- name: Apply pending containerd restarts
  ansible.builtin.meta: flush_handlers

- name: Check that containerd serves the CRI API
  ansible.builtin.command:
    cmd: "/usr/local/bin/ctr --address {{ containerd_socket }} plugins ls"
  register: containerd_plugins
  changed_when: false
  failed_when: >-
    containerd_plugins.rc != 0
    or (containerd_plugins.stdout_lines | select('search', 'io.containerd.cri.v1\\s+runtime\\s+.*\\s+ok') | list | length) == 0
