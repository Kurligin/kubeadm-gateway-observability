---
- name: Create apt keyrings and download cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - "{{ download_cache_dir }}"

# Always fetched (the upstream key gets its expiry extended in place), but
# reported as changed only when the content differs.
- name: Download Kubernetes apt repository key
  ansible.builtin.get_url:
    url: "{{ kube_packages_repo_url }}Release.key"
    dest: "{{ kube_packages_key_download }}"
    force: true
    owner: root
    group: root
    mode: "0644"

# The file must hold exactly one primary key, the pinned one; otherwise apt
# would also trust any extra key smuggled into it.
- name: Read fingerprints of the downloaded key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      gpg_home="$(mktemp -d)"
      trap 'rm -rf "${gpg_home}"' EXIT
      gpg --homedir "${gpg_home}" --batch --with-colons --show-keys {{ kube_packages_key_download | quote }} \
        | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }'
    executable: /bin/bash
  register: kube_packages_key_fingerprints
  changed_when: false

- name: Check the fingerprint of the Kubernetes apt repository key
  ansible.builtin.assert:
    that:
      - kube_packages_key_fingerprints.stdout_lines == [k8s_apt_key_fingerprint]
    fail_msg: >-
      {{ kube_packages_repo_url }}Release.key contains key(s)
      [{{ kube_packages_key_fingerprints.stdout_lines | join(', ') }}], expected exactly
      {{ k8s_apt_key_fingerprint }} (K8S_APT_KEY_FINGERPRINT in versions.env). The key is not
      trusted. If the Kubernetes project has rotated its signing key, verify the new fingerprint
      and update versions.env.
    quiet: true

# The armored key is used as is (apt accepts .asc keyrings), no dearmor needed.
- name: Trust the verified Kubernetes apt repository key
  ansible.builtin.copy:
    src: "{{ kube_packages_key_download }}"
    dest: "{{ kube_packages_keyring }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"

# Must be in place before the first install: without it apt picks newer
# kubeadm/kubelet/kubectl from any other repository and refuses the pinned
# versions as downgrades.
- name: Pin Kubernetes packages to pkgs.k8s.io
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/kubernetes
    content: |
      # Managed by Ansible (role kube_packages).
      Package: {{ kube_packages_pinned | join(' ') }}
      Pin: origin pkgs.k8s.io
      Pin-Priority: {{ kube_packages_pin_priority }}
    owner: root
    group: root
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      # Managed by Ansible (role kube_packages).
      deb [signed-by={{ kube_packages_keyring }}] {{ kube_packages_repo_url }} /
    owner: root
    group: root
    mode: "0644"
  register: kube_packages_repo

# Checking the downloaded index (not only whether the repository file
# changed) also recovers from a run interrupted before the cache refresh.
- name: Find the Kubernetes repository index
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "pkgs.k8s.io_core:_stable:_{{ k8s_minor }}_deb_Packages*"
  register: kube_packages_index

- name: Refresh apt cache for the Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ kube_packages_apt_lock_timeout }}"
  when: kube_packages_repo.changed or kube_packages_index.matched == 0

# Exact versions are pinned; held packages are allowed to change only to
# the pinned version (upgrade path when versions.env is bumped).
- name: Install kubeadm, kubelet and kubectl
  ansible.builtin.apt:
    name: "{{ kube_packages_names | map('regex_replace', '$', '=' ~ k8s_pkg_version) | list }}"
    state: present
    allow_change_held_packages: true
    allow_downgrade: true
    lock_timeout: "{{ kube_packages_apt_lock_timeout }}"

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kube_packages_names }}"

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
