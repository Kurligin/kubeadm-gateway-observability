---
node_prep_packages:
  - apt-transport-https
  - ca-certificates
  - conntrack
  - curl
  - gpg
  - jq
  - socat

node_prep_kernel_modules:
  - overlay
  - br_netfilter

node_prep_sysctl:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

# How long apt waits for a lock held by unattended-upgrades / cloud-init.
node_prep_apt_lock_timeout: 600
