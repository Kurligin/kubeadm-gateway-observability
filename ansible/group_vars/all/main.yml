---
# Only linux/amd64 checksums are pinned in versions.env.
cpu_arch: amd64

# Downloaded release artifacts are cached here (checksummed, reused on rerun).
download_cache_dir: /var/cache/kubeadm-gateway

# API server advertise address. Priority: inventory/host var `node_ip`,
# then the NODE_IP environment variable, then the IPv4 address of the
# interface that holds the default route.
node_ip_override: "{{ lookup('ansible.builtin.env', 'NODE_IP') }}"

# User that receives ~/.kube/config and the helm-diff plugin besides root:
# the SSH login user for remote hosts, otherwise the user that invoked
# `sudo`/`make` on this machine. Falls back to root when none of them is
# known (e.g. a minimal environment without USER), so only root gets them.
kube_user: >-
  {{ ansible_user
     | default(lookup('ansible.builtin.env', 'SUDO_USER'), true)
     | default(lookup('ansible.builtin.env', 'USER'), true)
     | default('root', true) }}

# API server port (6443) open to every network (default), or, with
# API_SERVER_OPEN=false in the environment of the deployment, only to the
# nodes of the cluster and the pods, like the other cluster-internal ports
# (role node_firewall). Then kubectl, helm and a remote inventory work
# only from the nodes themselves.
node_firewall_api_server_open: "{{ lookup('ansible.builtin.env', 'API_SERVER_OPEN') | default('true', true) | bool }}"

# Allow workloads on the control plane and let Cilium node IPAM use this
# node for LoadBalancer Services. Required on a single node; kept when
# workers join (`make add-worker`): the local-path volumes of Prometheus and
# VictoriaLogs live on this node, and the Gateway keeps its address.
k8s_single_node: true

# Settings of the kubelet configuration (KubeletConfiguration, top-level
# keys) on every node: in the kubeadm configuration of a new cluster, in the
# cluster-wide copy joining workers get (ConfigMap kube-system/kubelet-config)
# and, for nodes created before a setting existed, in
# /var/lib/kubelet/config.yaml of the node itself (role kubeadm_init on the
# control plane, kubeadm_join on the workers; the kubelet is restarted,
# running pods are not).
#   serverTLSBootstrap     serving certificate from the cluster CA (see
#                          role kubeadm_init, tasks/kubelet_serving.yml)
#   serializeImagePulls    false: images are pulled in parallel. By default
#                          the kubelet pulls one image at a time, so one
#                          slow or stalled pull (a mirror that stops
#                          sending, up to the 5 min progress timeout of
#                          containerd) holds back every other pod of the
#                          node.
#   maxParallelImagePulls  at most 3 at once, so that a slow network is not
#                          split between too many pulls.
kubelet_config_settings:
  serverTLSBootstrap: true
  serializeImagePulls: false
  maxParallelImagePulls: 3

# HTTP(S) proxy, taken from the environment of the deployment (HTTP_PROXY,
# HTTPS_PROXY, NO_PROXY or their lower-case forms). Unset: no proxy
# anywhere, and proxy settings written by an earlier run are removed. Set:
# Ansible downloads (play environment), apt (apt.conf.d) and containerd
# image pulls (systemd drop-in) use it; NO_PROXY is completed with what must
# never go through the proxy. The kubelet needs none: it pulls no images
# itself and only talks to the API server on this node.
proxy_http: "{{ lookup('ansible.builtin.env', 'HTTP_PROXY') | default(lookup('ansible.builtin.env', 'http_proxy'), true) }}"
proxy_https: "{{ lookup('ansible.builtin.env', 'HTTPS_PROXY') | default(lookup('ansible.builtin.env', 'https_proxy'), true) }}"
proxy_enabled: "{{ (proxy_http ~ proxy_https) | length > 0 }}"
proxy_no_proxy: >-
  {{ ((lookup('ansible.builtin.env', 'NO_PROXY') | default(lookup('ansible.builtin.env', 'no_proxy'), true)).split(',')
      + ['localhost', '127.0.0.1', '::1']
      + (ansible_facts['all_ipv4_addresses'] | default([]))
      + [k8s_pod_subnet, k8s_service_subnet, '.svc', '.cluster.local', proxy_demo_domain, '.' ~ proxy_demo_domain])
     | map('trim') | reject('equalto', '') | unique | join(',') }}
proxy_demo_domain: demo.local
# The same variables emptied, for commands that must not see the proxy
# (task-level environment is merged over the play's).
proxy_env_unset:
  HTTP_PROXY: ""
  http_proxy: ""
  HTTPS_PROXY: ""
  https_proxy: ""
  NO_PROXY: ""
  no_proxy: ""
# User name and password in the proxy URL: then the files holding it are
# readable by root only.
proxy_has_credentials: "{{ (proxy_http ~ ' ' ~ proxy_https) is search('://[^/ ]*@') }}"
proxy_env: >-
  {{ {'HTTP_PROXY': proxy_http, 'http_proxy': proxy_http,
      'HTTPS_PROXY': proxy_https, 'https_proxy': proxy_https,
      'NO_PROXY': proxy_no_proxy, 'no_proxy': proxy_no_proxy}
     if proxy_enabled | bool else {} }}

# Pull-through registry mirrors for containerd (image pulls of the kubelet,
# kubeadm and `make images`), per registry: a comma-separated list of
# mirror URLs (https://host[:port], the registry's namespace at the root),
# tried in this order before the registry itself (server), which stays the
# last resort. Taken from the environment of the deployment,
# REGISTRY_MIRRORS_<REGISTRY> (DOCKER_IO, REGISTRY_K8S_IO, QUAY_IO,
# GHCR_IO): unset means the default (Docker Hub: versions.env, the others:
# none), empty means no mirror. Images are pinned by digest, so a mirror
# cannot change what runs. A registry without mirrors gets no hosts.toml
# (containerd's built-in behaviour); a hosts.toml written by an earlier run
# is removed. Behind an HTTP(S) proxy the mirrors are reached through it.
registry_mirrors:
  docker.io:
    server: https://registry-1.docker.io
    mirrors: "{{ lookup('ansible.builtin.env', 'REGISTRY_MIRRORS_DOCKER_IO', default=registry_mirrors_docker_io_default) }}"
  registry.k8s.io:
    server: https://registry.k8s.io
    mirrors: "{{ lookup('ansible.builtin.env', 'REGISTRY_MIRRORS_REGISTRY_K8S_IO', default='') }}"
  quay.io:
    server: https://quay.io
    mirrors: "{{ lookup('ansible.builtin.env', 'REGISTRY_MIRRORS_QUAY_IO', default='') }}"
  ghcr.io:
    server: https://ghcr.io
    mirrors: "{{ lookup('ansible.builtin.env', 'REGISTRY_MIRRORS_GHCR_IO', default='') }}"
