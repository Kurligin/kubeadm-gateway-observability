{{- $app := printf "envoy_cluster_name=~\"%s\"" .Values.envoyGateway.appClusterRegex }}
{{- $deployments := join "|" .Values.app.deployments }}
{{- $a := .Values.alerts }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-extras.labels" . | nindent 4 }}
spec:
  groups:
    # --- Request and 5xx counters of the application route, from zero ---
    # Envoy creates the traffic counters of a cluster lazily: the request
    # counter on the first request, the 5xx counter on the first 5xx. The
    # series appears in Prometheus already above zero, and rate()/increase()
    # need two samples, so the first batch is invisible: 10 failed requests
    # in a fresh series read as 0 % errors. These copies (per Envoy pod and
    # cluster) start at 0 as soon as the cluster exists:
    # envoy_cluster_membership_total is created together with the cluster.
    # Used by High5xxRate (below), the SLO rules and the dashboards.
    - name: envoy-app-counters
      rules:
        - record: envoy_app:upstream_rq_total:filled
          expr: |
            sum by (namespace, pod, envoy_cluster_name) (envoy_cluster_upstream_rq_total{ {{- $app }}})
            or
            0 * group by (namespace, pod, envoy_cluster_name) (envoy_cluster_membership_total{ {{- $app }}})
        - record: envoy_app:upstream_rq_5xx_total:filled
          expr: |
            sum by (namespace, pod, envoy_cluster_name) (envoy_cluster_upstream_rq_xx{ {{- $app }}, envoy_response_code_class="5"})
            or
            0 * group by (namespace, pod, envoy_cluster_name) (envoy_cluster_membership_total{ {{- $app }}})

        # In the same group as the counters above: rules of one group run in
        # order, so the alert always sees this evaluation's values.
        - alert: High5xxRate
          expr: |
            (
              (sum(rate(envoy_app:upstream_rq_5xx_total:filled[5m])) or vector(0))
              /
              sum(rate(envoy_app:upstream_rq_total:filled[5m]))
            ) > {{ $a.errorRatio }}
            and
            sum(rate(envoy_app:upstream_rq_total:filled[5m])) > {{ $a.minRequestRate }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than {{ mulf $a.errorRatio 100 }}% of application responses are 5xx"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of the requests to the application route
              (Envoy clusters {{ .Values.envoyGateway.appClusterRegex }}) ended with a 5xx
              response over the last 5 minutes. See the "Demo app — golden signals"
              dashboard and the Angie error log in VictoriaLogs.

    # --- Demo application behind the Gateway ---
    - name: demo-app
      rules:
        - alert: AppDown
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Values.app.namespace }}", deployment=~"{{ $deployments }}"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{ $labels.deployment }}" }} has no ready replicas"
            description: >-
              Deployment {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} has had no available
              replicas for 1 minute: the Gateway has nowhere to send its share of
              the traffic. Check `kubectl -n {{ "{{ $labels.namespace }}" }} get pods` and the pod events.

        - alert: HighP95Latency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{ {{- $app }}}[5m]))
            ) > {{ mulf $a.p95LatencySeconds 1000 }}
            and
            sum(rate(envoy_cluster_upstream_rq_total{ {{- $app }}}[5m])) > {{ $a.minRequestRate }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Application p95 latency is above {{ $a.p95LatencySeconds }} s"
            description: >-
              95% of the requests to the application are answered within
              {{ "{{ $value | printf \"%.0f\" }}" }} ms (Envoy upstream time, last 5 minutes); the
              threshold is {{ mulf $a.p95LatencySeconds 1000 }} ms.

    # --- Gateway API / Envoy ---
    - name: gateway
      rules:
        - alert: GatewayNotProgrammed
          expr: |
            gatewayapi_gateway_status{namespace="{{ .Values.gateway.namespace }}", name="{{ .Values.gateway.name }}", type="Programmed"} != 1
            or
            absent(gatewayapi_gateway_status{namespace="{{ .Values.gateway.namespace }}", name="{{ .Values.gateway.name }}", type="Programmed"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Gateway {{ .Values.gateway.namespace }}/{{ .Values.gateway.name }} is not Programmed"
            description: >-
              The Gateway's Programmed condition has not been True for 5 minutes (or the
              Gateway is missing): Envoy Gateway could not configure the proxy or give it
              an address. Check `kubectl -n {{ .Values.gateway.namespace }} describe gateway {{ .Values.gateway.name }}`
              and the envoy-gateway controller logs.

        - alert: GatewayProxyDown
          expr: |
            sum(up{job="envoy", namespace="{{ .Values.envoyGateway.namespace }}"}) == 0
            or
            absent(up{job="envoy", namespace="{{ .Values.envoyGateway.namespace }}"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No Envoy proxy of the Gateway is up"
            description: >-
              Prometheus cannot scrape any Envoy proxy in {{ .Values.envoyGateway.namespace }}
              for 2 minutes: traffic to the cluster is most likely interrupted.

    # --- Log collection ---
    - name: logging
      rules:
        - alert: FluentdDown
          expr: |
            up{job="{{ .Values.logging.collectorJob }}"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fluentd {{ "{{ $labels.pod }}" }} is down"
            description: >-
              Prometheus cannot scrape Fluentd {{ "{{ $labels.pod }}" }} for 5 minutes: container
              logs of its node are not being shipped (they are read from the last
              position once it is back).

        - alert: FluentdMissing
          expr: |
            absent(up{job="{{ .Values.logging.collectorJob }}"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No Fluentd is scraped at all"
            description: >-
              Prometheus has no Fluentd target for 5 minutes: the DaemonSet is missing or
              none of its pods is running, so no container logs are collected. Check
              `kubectl -n {{ .Values.logging.namespace }} get daemonset,pods`.

        # Judged by the receiving side: Fluentd's own write counter grows on
        # failed attempts too, so it cannot tell that nothing arrives. The
        # "up" term makes it pending at once when VictoriaLogs is down (the
        # rate alone would still see the last samples for its whole window).
        - alert: FluentdNoOutput
          expr: |
            (sum(rate(fluentd_input_status_num_records_total[5m])) > 0)
            unless on ()
            (
              (sum(rate(vl_rows_ingested_total{job="{{ .Values.victoriaLogs.job }}"}[2m])) > 0)
              and on ()
              (sum(up{job="{{ .Values.victoriaLogs.job }}"}) > 0)
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fluentd reads logs, but VictoriaLogs receives nothing"
            description: >-
              Fluentd keeps reading container logs, but VictoriaLogs has not ingested a
              single row for 5 minutes (or is not running). Logs pile up in the Fluentd
              file buffer and are sent once VictoriaLogs is back; when the buffer is full,
              the oldest are dropped. Check `kubectl -n {{ .Values.victoriaLogs.namespace }} get pods`
              and the Fluentd logs.

        - alert: FluentdBufferErrors
          expr: |
            sum by (pod) (increase(fluentd_output_status_retry_count{plugin_id="out_victorialogs"}[10m])) > 0
            or
            sum by (pod) (increase(fluentd_output_status_num_errors{plugin_id="out_victorialogs"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fluentd retries sending logs to VictoriaLogs"
            description: >-
              {{ "{{ $labels.pod }}" }} failed to flush buffer chunks to VictoriaLogs
              ({{ "{{ $value }}" }} retries or errors in 10 minutes). Logs are kept in the file
              buffer and retried; if the buffer fills up, the oldest chunks are dropped.

        - alert: FluentdBufferAlmostFull
          expr: |
            fluentd_output_status_buffer_available_space_ratio{plugin_id="out_victorialogs"} < 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fluentd output buffer is almost full"
            description: >-
              Only {{ "{{ $value | printf \"%.0f\" }}" }}% of the VictoriaLogs output buffer of
              {{ "{{ $labels.pod }}" }} is free; when it is full, the oldest logs are dropped.

    {{- if .Values.tracing.enabled }}

    # --- Distributed tracing ---
    # Judged by both sides, like FluentdNoOutput: Envoy hands spans to its
    # exporter (envoy_tracing_opentelemetry_spans_sent counts only sampled
    # spans, so untraced requests -- UI routes, a non-UUID X-Request-ID --
    # cannot trigger it), but VictoriaTraces ingests none. The "up" term
    # makes it pending at once when VictoriaTraces is down.
    - name: tracing
      rules:
        - alert: TracingNoSpans
          expr: |
            (sum(rate(envoy_tracing_opentelemetry_spans_sent{namespace="{{ .Values.envoyGateway.namespace }}"}[5m])) > 0)
            unless on ()
            (
              (sum(rate(vt_rows_ingested_total{job="{{ .Values.tracing.job }}", type=~"opentelemetry_traces_.*"}[5m])) > 0)
              and on ()
              (sum(up{job="{{ .Values.tracing.job }}"}) > 0)
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Envoy produces spans, but VictoriaTraces receives none"
            description: >-
              The Gateway's Envoy proxies keep exporting spans, but VictoriaTraces has
              not ingested a single one for 5 minutes (or is not running): the traces
              are lost (Envoy keeps only a small buffer). Check
              `kubectl -n {{ .Values.tracing.namespace }} get pods`, the EnvoyProxy status
              (`kubectl -n {{ .Values.envoyGateway.namespace }} get envoyproxy -o yaml`) and the Envoy
              statistics of the "tracing" cluster.

        # Part of the spans is lost: export attempts of the "tracing" cluster
        # that failed (5xx, reset with the request in flight, connect
        # failure), as a share of all attempts. A failed attempt that was
        # retried counts too, so a few are normal; 5 % over 15 minutes is
        # not.
        - alert: TracingExportErrors
          expr: |
            (
              (
                (sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name="tracing", envoy_response_code_class="5"}[15m])) or vector(0))
                + (sum(increase(envoy_cluster_upstream_cx_destroy_with_active_rq{envoy_cluster_name="tracing"}[15m])) or vector(0))
                + (sum(increase(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name="tracing"}[15m])) or vector(0))
              )
              /
              sum(increase(envoy_cluster_upstream_rq_total{envoy_cluster_name="tracing"}[15m]))
            ) > {{ .Values.tracing.exportErrorRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Envoy fails to export part of its spans"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of the span exports from the Envoy
              proxies to VictoriaTraces failed over the last 15 minutes (5xx, connection
              reset with the request in flight or connect failure): the spans of those
              batches are missing from the traces. See the Envoy statistics of the
              "tracing" cluster and the VictoriaTraces logs.
    {{- end }}

    # --- Control plane ---
    # API server, controller-manager and scheduler are covered by the
    # standard rules of kube-prometheus-stack (KubeAPIDown,
    # KubeControllerManagerDown, KubeSchedulerDown, TargetDown); etcd is
    # scraped through a proxy under its own job name, which they do not know.
    - name: control-plane
      rules:
        - alert: EtcdMetricsMissing
          expr: |
            absent(up{job="etcd-metrics"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd metrics are not collected"
            description: >-
              No successful scrape of etcd through kube-rbac-proxy (job etcd-metrics) for
              5 minutes: etcd alerts and the etcd dashboard are blind. Check the
              etcd-metrics-proxy DaemonSet.
