{{- $r := .Values.alertReceiver }}
{{- $image := required "alertReceiver.image is required (ALERT_RECEIVER_IMAGE in versions.env)" $r.image }}
{{- $script := .Files.Get "files/alert_receiver.py" }}
{{- $selector := dict "app.kubernetes.io/name" $r.name "app.kubernetes.io/instance" .Release.Name }}
# Alertmanager webhook receiver: every alert -> one JSON line on stdout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $r.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-extras.labels" . | nindent 4 }}
data:
  alert_receiver.py: |-
    {{- $script | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $r.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-extras.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $r.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-extras.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The new pod is ready before the old one stops: no gap in alert delivery.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $selector | nindent 8 }}
      annotations:
        # Roll the pod when the script changes.
        checksum/script: {{ $script | sha256sum }}
    spec:
      restartPolicy: Always
      serviceAccountName: {{ $r.name }}
      automountServiceAccountToken: false
      # Pod Security "restricted": non-root, read-only root filesystem, no
      # capabilities, seccomp RuntimeDefault.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/alert_receiver.py"]
          env:
            - name: PORT
              value: {{ $r.port | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: {{ $r.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ $r.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $r.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-extras.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - name: http
      port: {{ $r.port }}
      targetPort: http
      protocol: TCP
