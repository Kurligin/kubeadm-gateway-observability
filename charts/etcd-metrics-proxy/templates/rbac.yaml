# The proxy itself: authenticates bearer tokens (TokenReview) and checks
# permissions (SubjectAccessReview) through the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-metrics-proxy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-auth-delegator" .Chart.Name }}
  labels:
    {{- include "etcd-metrics-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}
    namespace: {{ .Release.Namespace }}
---
# The only permission the proxy accepts (see configmap.yaml): get
# services/metrics of the Service "{{ include "etcd-metrics-proxy.serviceName" . }}" in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-reader" .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-metrics-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services/metrics"]
    resourceNames: [{{ include "etcd-metrics-proxy.serviceName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-reader" .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-metrics-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-reader" .Chart.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ required "scraper.serviceAccount is required" .Values.scraper.serviceAccount }}
    namespace: {{ required "scraper.namespace is required" .Values.scraper.namespace }}
