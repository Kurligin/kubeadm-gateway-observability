{{- $tag := required "image.tag is required (KUBE_RBAC_PROXY_VERSION in versions.env)" .Values.image.tag }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-metrics-proxy.labels" . | nindent 4 }}
  annotations:
    # Accepted kube-linter finding (`make lint`), see hostNetwork below.
    ignore-check.kube-linter.io/host-network: "etcd serves metrics on the node loopback only; the proxy port requires TLS, a token and RBAC"
spec:
  selector:
    matchLabels:
      {{- include "etcd-metrics-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "etcd-metrics-proxy.labels" . | nindent 8 }}
      annotations:
        # Restart the proxy when its authorisation config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      # etcd runs on control-plane nodes and serves metrics on their
      # loopback, which is reachable only from the host network.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-rbac-proxy
          image: "{{ .Values.image.repository }}:v{{ $tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secure-listen-address=$(NODE_IP):{{ .Values.listenPort }}
            - --upstream={{ .Values.upstream }}
            - --allow-paths={{ join "," .Values.allowPaths }}
            - --config-file=/etc/kube-rbac-proxy/config/config.yaml
            # /healthz for the probes on a separate port, so they neither
            # need a token nor log TLS handshake errors (as TCP probes do).
            - --proxy-endpoints-port={{ .Values.healthPort }}
            - --tls-cert-file=/etc/kube-rbac-proxy/tls/tls.crt
            - --tls-private-key-file=/etc/kube-rbac-proxy/tls/tls.key
            - --tls-min-version=VersionTLS12
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: https-metrics
              containerPort: {{ .Values.listenPort }}
              protocol: TCP
            - name: https-health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https-health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https-health
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /etc/kube-rbac-proxy/tls
              readOnly: true
            - name: config
              mountPath: /etc/kube-rbac-proxy/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}
        # Renewed by cert-manager; the proxy reloads the files.
        - name: tls
          secret:
            secretName: {{ include "etcd-metrics-proxy.tlsSecret" . }}
