{{- $tag := required "image.tag is required (FLUENTD_IMAGE_TAG in versions.env)" .Values.image.tag }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "logging.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "logging.labels" . | nindent 8 }}
      annotations:
        # Restart Fluentd when its configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: fluentd
      # Flush the buffer to disk on shutdown.
      terminationGracePeriodSeconds: 30
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      # Container log files are owned by root with mode 0640, so Fluentd runs
      # as root (it reads them as their owner, no capability needed). The rest
      # is locked down: all capabilities dropped (no CAP_DAC_OVERRIDE, so file
      # permissions apply as usual), no privilege escalation, read-only root
      # filesystem. Of the host it sees only the pod log directories
      # (read-only) and {{ .Values.hostStateDir }} (tail positions and buffer).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluentd
          image: "{{ .Values.image.repository }}:{{ $tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Own configuration instead of the image's kubernetes.conf.
            - name: FLUENTD_CONF
              value: custom/fluent.conf
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/custom
              readOnly: true
            # Same paths as on the host: the symlinks in /var/log/containers
            # point to absolute paths in /var/log/pods.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: state
              mountPath: {{ .Values.hostStateDir }}
            # Ruby refuses a world-writable temporary directory without the
            # sticky bit (an emptyDir is 0777), so /tmp is a root-owned
            # sub-directory of the state directory.
            - name: state
              mountPath: /tmp
              subPath: tmp
      volumes:
        - name: config
          configMap:
            name: fluentd
        # Written by the kubelet: /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log
        # and the symlinks to them, /var/log/containers/*.log.
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: {{ .Values.hostStateDir }}
            type: DirectoryOrCreate
