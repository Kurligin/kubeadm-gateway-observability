---
image:
  repository: docker.angie.software/angie
  # Required; set from versions.env (ANGIE_VERSION) by helmfile.
  tag: ""
  pullPolicy: IfNotPresent

# One Deployment + Service + ConfigMap per entry, same image, different config.
versions:
  - name: web-v1
    version: v1
  - name: web-v2
    version: v2

replicaCount: 2

ports:
  # Unprivileged ports: the container runs as a non-root user.
  http: 8080
  metrics: 9113

service:
  port: 80

# Nothing listens on this local port: /broken always fails with 502.
brokenUpstreamPort: 9

angie:
  workerProcesses: 1
  workerConnections: 1024

# User "angie" from the image (uid 100, gid 101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

podDisruptionBudget:
  minAvailable: 1

# Seconds to keep serving after the pod is marked for deletion, so the
# gateway stops sending traffic before Angie exits.
preStopSleepSeconds: 5

# Ingress is denied by default; only the Gateway's Envoy proxies reach the
# HTTP port and only Prometheus the metrics port. Egress is not restricted.
# Kubelet probes come from the node itself, which Cilium always allows.
networkPolicy:
  enabled: true
  gateway:
    namespace: envoy-gateway-system
    labels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  prometheus:
    namespace: monitoring
    labels:
      app.kubernetes.io/name: prometheus

# Needs the Prometheus Operator CRDs (installed with kube-prometheus-stack).
serviceMonitor:
  enabled: false
  interval: 30s
