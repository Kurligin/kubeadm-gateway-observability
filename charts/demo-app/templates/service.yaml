{{- range .Values.versions }}
{{- $ctx := dict "root" $ "item" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo-app.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "demo-app.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ $.Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- if .shadow }}
---
# Target of the gateway's request mirroring: same pods, shadow port.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-shadow" .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo-app.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "demo-app.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: shadow
      protocol: TCP
{{- end }}
{{- end }}
