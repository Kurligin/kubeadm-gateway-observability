{{- range .Values.versions }}
{{- $ctx := dict "root" $ "item" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo-app.labels" $ctx | nindent 4 }}
data:
  angie.conf: |
    {{- include "demo-app.angieConf" $ctx | nindent 4 }}
{{- end }}
