{{- $tag := required "image.tag is required (ANGIE_VERSION in versions.env)" .Values.image.tag }}
{{- range .Values.versions }}
{{- $ctx := dict "root" $ "item" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo-app.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "demo-app.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "demo-app.labels" $ctx | nindent 8 }}
      annotations:
        # Roll the pods when the configuration changes.
        checksum/config: {{ include "demo-app.angieConf" $ctx | sha256sum }}
    spec:
      restartPolicy: Always
      serviceAccountName: {{ $.Chart.Name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # Spread replicas across nodes when there is more than one.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "demo-app.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: angie
          image: "{{ $.Values.image.repository }}:{{ $tag }}{{ with $.Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["angie"]
          args: ["-c", "/etc/angie/k8s/angie.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: {{ $.Values.ports.http }}
              protocol: TCP
            - name: shadow
              containerPort: {{ $.Values.ports.shadow }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $.Values.ports.metrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $.Values.preStopSleepSeconds }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/angie/k8s
              readOnly: true
            - name: run
              mountPath: /run
            - name: cache
              mountPath: /var/cache/angie
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .name }}
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
