{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  # Service label "version" (v1/v2) on every series: canary split by version.
  targetLabels:
    - version
  endpoints:
    - port: metrics
      path: /p8s
      interval: {{ .Values.serviceMonitor.interval }}
      metricRelabelings:
        # "status_zone <variable> zone=server" also exports the shared zone
        # "server" itself, always zero; only its keys (app, probes) count.
        - sourceLabels: [__name__, zone]
          regex: "angie_http_server_zones_.+;server"
          action: drop
{{- end }}
