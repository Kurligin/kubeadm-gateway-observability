{{- $app := .Values.app }}
{{- $stable := dict "service" $app.stable.service "namespace" $app.namespace "port" $app.port }}
{{- $canary := dict "service" $app.canary.service "namespace" $app.namespace "port" $app.port }}
{{- $mirror := dict "service" $app.mirror.service "namespace" $app.namespace "port" $app.port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  {{- include "gateway.httpsParent" . | nindent 2 }}
  hostnames:
    - {{ include "gateway.appHostname" . | quote }}
  rules:
    # Path-based: /v2 always goes to the canary version.
    - matches:
        - path:
            type: PathPrefix
            value: {{ $app.canaryPath }}
      filters:
        {{- include "gateway.stripPrefixFilter" . | nindent 8 }}
        {{- include "gateway.headerFilters" (dict "root" . "rule" "path-v2") | nindent 8 }}
      {{- include "gateway.timeouts" . | nindent 6 }}
      backendRefs:
        {{- include "gateway.backendRef" $canary | nindent 8 }}
    # Header-based: opt in to the canary version.
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: Exact
              name: {{ $app.canaryHeader.name }}
              value: {{ $app.canaryHeader.value | quote }}
      filters:
        {{- include "gateway.headerFilters" (dict "root" . "rule" "header-canary") | nindent 8 }}
      {{- include "gateway.timeouts" . | nindent 6 }}
      backendRefs:
        {{- include "gateway.backendRef" $canary | nindent 8 }}
    # Weighted canary for everything else, with a shadow copy of every
    # request sent to the mirror Service (its answer is discarded).
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- include "gateway.headerFilters" (dict "root" . "rule" "weighted") | nindent 8 }}
        {{- if $app.mirror.enabled }}
        - type: RequestMirror
          requestMirror:
            backendRef:
              group: ""
              kind: Service
              name: {{ $mirror.service }}
              namespace: {{ $mirror.namespace }}
              port: {{ $mirror.port }}
        {{- end }}
      {{- include "gateway.timeouts" . | nindent 6 }}
      backendRefs:
        {{- include "gateway.backendRef" (merge (dict "weight" $app.stable.weight) $stable) | nindent 8 }}
        {{- include "gateway.backendRef" (merge (dict "weight" $app.canary.weight) $canary) | nindent 8 }}
---
# Separate route so its tight rate limit never affects the main route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-limited
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  {{- include "gateway.httpsParent" . | nindent 2 }}
  hostnames:
    - {{ include "gateway.appHostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $app.limited.path }}
      filters:
        {{- include "gateway.stripPrefixFilter" . | nindent 8 }}
        {{- include "gateway.headerFilters" (dict "root" . "rule" "limited") | nindent 8 }}
      {{- include "gateway.timeouts" . | nindent 6 }}
      backendRefs:
        {{- include "gateway.backendRef" $stable | nindent 8 }}
