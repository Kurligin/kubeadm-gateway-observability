apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  commonName: {{ printf "*.%s" .Values.domain | quote }}
  dnsNames:
    - {{ .Values.domain | quote }}
    - {{ printf "*.%s" .Values.domain | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.gateway.tls.clusterIssuer }}
