{{- $proxy := .Values.envoyProxy }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $proxy.name }}
  namespace: {{ $proxy.namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ $proxy.replicas }}
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: {{ $proxy.rollingUpdate.maxUnavailable }}
            maxSurge: {{ $proxy.rollingUpdate.maxSurge }}
        pod:
          topologySpreadConstraints:
            - maxSkew: {{ $proxy.topologySpread.maxSkew }}
              topologyKey: {{ $proxy.topologySpread.topologyKey }}
              whenUnsatisfiable: {{ $proxy.topologySpread.whenUnsatisfiable }}
              labelSelector:
                matchLabels:
                  {{- include "gateway.proxySelector" . | nindent 18 }}
        container:
          {{- with $proxy.image }}
          image: {{ . | quote }}
          {{- end }}
          resources:
            {{- toYaml $proxy.resources | nindent 12 }}
      # Voluntary disruptions (node drain, eviction) never take the last
      # proxy away.
      envoyPDB:
        minAvailable: {{ $proxy.podDisruptionBudget.minAvailable }}
      envoyService:
        type: LoadBalancer
        loadBalancerClass: {{ $proxy.loadBalancerClass }}
        externalTrafficPolicy: {{ $proxy.externalTrafficPolicy }}
        allocateLoadBalancerNodePorts: {{ $proxy.allocateLoadBalancerNodePorts }}
  telemetry:
    # JSON access log to stdout, collected together with the pod logs.
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              uri: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              status: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              upstream_duration_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              host: "%REQ(:AUTHORITY)%"
              x_request_id: "%REQ(X-REQUEST-ID)%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              remote_addr: "%DOWNSTREAM_REMOTE_ADDRESS%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              route: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    # Prometheus endpoint of every Envoy pod (:19001/stats/prometheus).
    metrics:
      prometheus:
        disable: false
