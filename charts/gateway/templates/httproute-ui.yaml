{{- range .Values.uiRoutes }}
{{- $name := printf "ui-%s" .host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  {{- include "gateway.httpsParent" $ | nindent 2 }}
  hostnames:
    - {{ printf "%s.%s" .host $.Values.domain | quote }}
  rules:
    - backendRefs:
        {{- include "gateway.backendRef" (dict "service" .service "namespace" .namespace "port" .port) | nindent 8 }}
{{- if .basicAuth }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  basicAuth:
    users:
      group: ""
      kind: Secret
      name: {{ $.Values.basicAuth.secretName }}
{{- end }}
{{- end }}
