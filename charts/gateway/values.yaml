---
# Every hostname below is <name>.<domain>; the certificate covers <domain>
# and *.<domain>.
domain: demo.local

gatewayClassName: eg

envoyProxy:
  name: node-lb
  # Envoy Gateway looks up parametersRef in its own namespace.
  namespace: envoy-gateway-system
  # Cilium node IPAM: the LoadBalancer address is the node IP.
  loadBalancerClass: io.cilium/node
  externalTrafficPolicy: Cluster
  # Cilium (kube-proxy replacement) serves the LoadBalancer address itself;
  # no NodePorts are opened on the node.
  allocateLoadBalancerNodePorts: false
  # Envoy image; set from versions.env (ENVOY_PROXY_IMAGE, tag@digest) by
  # helmfile. Empty: the default of the Envoy Gateway release.
  image: ""
  # Two proxies behind the LoadBalancer Service: one can be restarted,
  # evicted or rolled out while the other keeps serving.
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  # A new proxy is started and ready before an old one is stopped.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  # Spread the proxies over nodes when there are several; on a single node
  # both run there (ScheduleAnyway). Only pods of the same revision count
  # (pod-template-hash): otherwise, during a rollout, the old pods on one
  # node push every new pod to the other.
  topologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    matchLabelKeys:
      - pod-template-hash
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 512Mi

# Distributed tracing of the proxies (spans to an OTLP/gRPC collector).
# Off by default; helmfile turns it on together with VictoriaTraces.
tracing:
  enabled: false
  # Share of requests traced, percent. Every request is traced here: the
  # demo has little traffic, and `make verify` must find its own request.
  # Under real load 1-10 % keeps the overhead and the storage small (an
  # incoming sampled "traceparent" is honoured either way).
  samplingRate: 100
  # service.name of the spans.
  serviceName: envoy-gateway
  # OTLP/gRPC Service (appProtocol: grpc) of the trace storage.
  service: ""
  namespace: ""
  port: 4317
  tags:
    # Envoy route of the request (httproute/<ns>/<route>/rule/<n>/...).
    gateway.route: "%ROUTE_NAME%"
    # Rule name the route writes into X-Gateway-Route (weighted, path-v2, ...).
    gateway.rule: "%REQ(X-GATEWAY-ROUTE)%"
    # Version of the backend that answered (Angie response header; a header
    # the route removes from the response is gone before the span is
    # finished, so this one is passed on to the client). The upstream span
    # carries the pod address (upstream_address) by itself.
    backend.version: "%RESP(X-APP-VERSION)%"

gateway:
  name: public
  tls:
    # Secret with the certificate, issued by cert-manager.
    secretName: demo-tls
    clusterIssuer: demo-ca

# Keep an incoming X-Request-ID (so a caller can trace its own request) or
# generate one. Envoy passes it to the backend in the X-Request-ID header.
requestID: PreserveOrGenerate

app:
  host: app
  # Backends live in this namespace; a ReferenceGrant there allows the
  # routes in the gateway namespace to reach them.
  namespace: demo
  port: 80
  stable:
    service: web-v1
    weight: 90
  canary:
    service: web-v2
    weight: 10
  # Always routed to the canary version.
  canaryPath: /v2
  canaryHeader:
    name: X-Canary
    value: "true"
  # Gateway API timeout of every rule of the application routes
  # (HTTPRoute spec.rules[].timeouts.request, standard channel): the whole
  # request, retries included. timeouts.backendRequest is not set: Envoy
  # Gateway 1.9 turns it into the same route-level timeout (overriding
  # "request"), not into a per-attempt one; the per-attempt timeout is
  # trafficPolicy.retry.perRetryTimeout below.
  timeouts:
    request: 10s
  # Request and response header filters of every rule (standard
  # RequestHeaderModifier / ResponseHeaderModifier).
  headers:
    # Set to the name of the matched rule on the request (the backend logs
    # it; a value sent by the client is overwritten) and on the response.
    route: X-Gateway-Route
    # Internal headers of the backend, removed from every response.
    removeFromResponse:
      - X-Backend-Pod
      - Server
  # Shadow traffic (standard RequestMirror filter): every request of the
  # weighted rule is also sent to this Service; its response is discarded,
  # the client only ever sees the answer of the primary backend. The
  # Service (demo-app chart) leads to web-v2 on a separate port, so the
  # copies are counted and logged apart from live traffic.
  mirror:
    enabled: true
    service: web-v2-shadow
  # Envoy Gateway policies applied to the whole application route.
  trafficPolicy:
    connectTimeout: 2s
    # Envoy retries regardless of the HTTP method, so only failures where the
    # request provably never reached the application are retried: that is
    # safe for non-idempotent methods (POST, PATCH) too. 5xx responses and
    # resets after the request was sent are not retried.
    retry:
      numRetries: 2
      perRetryTimeout: 3s
      triggers:
        - connect-failure
        - refused-stream
        - reset-before-request
    # Flood guard per Envoy replica, far above normal and test traffic.
    rateLimit:
      requests: 500
      unit: Second
  # Separate path with a tight limit to demonstrate HTTP 429 on demand.
  limited:
    path: /limited
    rateLimit:
      requests: 10
      unit: Minute
